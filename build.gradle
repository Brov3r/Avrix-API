import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.avrix.api'
version = providers.gradleProperty('version').orElse('0.0.0').get()

def baseArchiveName = rootProject.name
def customBuildPath = System.getenv('BUILD_PATH') ?: layout.buildDirectory.get().asFile
def projectDirectory = layout.projectDirectory.asFile

def pzClientDirProperty = providers.gradleProperty('pzClientDir')
        .orElse(providers.environmentVariable('PZ_CLIENT_DIR'))
def pzServerDirProperty = providers.gradleProperty('pzServerDir')
        .orElse(providers.environmentVariable('PZ_SERVER_DIR'))
def pzGameJarProperty = providers.gradleProperty('pzGameJar')
        .orElse(providers.environmentVariable('PZ_GAME_JAR'))

def userHome = System.getProperty('user.home')
def osName = (System.getProperty('os.name') ?: '').toLowerCase(Locale.ROOT)
def programFilesX86 = System.getenv('ProgramFiles(x86)') ?: 'C:/Program Files (x86)'
def programFiles = System.getenv('ProgramFiles') ?: 'C:/Program Files'

def steamCommonRoots = []
if (osName.contains('win')) {
    steamCommonRoots = [
            new File(programFilesX86, 'Steam/steamapps/common'),
            new File(programFiles, 'Steam/steamapps/common')
    ]
} else if (osName.contains('mac')) {
    steamCommonRoots = [
            new File(userHome, 'Library/Application Support/Steam/steamapps/common')
    ]
} else {
    steamCommonRoots = [
            new File(userHome, '.steam/steam/steamapps/common'),
            new File(userHome, '.local/share/Steam/steamapps/common'),
            new File(userHome, '.steam/root/steamapps/common'),
            new File('/usr/local/share/steam/steamapps/common')
    ]
}

def clientCandidates = steamCommonRoots.collect { new File(it, 'ProjectZomboid') }
def serverCandidates = steamCommonRoots.collect { new File(it, 'Project Zomboid Dedicated Server') }
def defaultClientDir = clientCandidates.find { it.isDirectory() } ?: clientCandidates[0]
def defaultServerDir = serverCandidates.find { it.isDirectory() } ?: serverCandidates[0]

def resolveConfiguredDirectory = { Provider<String> configured, File fallback ->
    if (!configured.isPresent()) {
        return fallback
    }
    File directory = new File(configured.get())
    return directory.isAbsolute() ? directory : new File(projectDirectory, configured.get())
}

def resolveGameJar = {
    if (pzGameJarProperty.isPresent()) {
        File configured = new File(pzGameJarProperty.get())
        File jar = configured.isAbsolute() ? configured : new File(projectDirectory, pzGameJarProperty.get())
        if (!jar.isFile()) {
            throw new GradleException(
                    "Project Zomboid JAR not found: ${jar}. Check -PpzGameJar=... or PZ_GAME_JAR."
            )
        }
        return jar
    }

    // Explicitly configured game directories take precedence over the local libs copy.
    List<File> explicitJars = []
    if (pzServerDirProperty.isPresent()) {
        explicitJars.add(new File(
                resolveConfiguredDirectory(pzServerDirProperty, defaultServerDir),
                'java/projectzomboid.jar'
        ))
    }
    if (pzClientDirProperty.isPresent()) {
        explicitJars.add(new File(
                resolveConfiguredDirectory(pzClientDirProperty, defaultClientDir),
                'projectzomboid.jar'
        ))
    }
    File explicitJar = explicitJars.find { it.isFile() }
    if (explicitJar != null) {
        return explicitJar
    }

    List<File> libsJars = fileTree(
            dir: new File(projectDirectory, 'libs'),
            include: ['ProjectZomboid*.jar', 'projectzomboid*.jar']
    ).files
            .findAll { it.isFile() }
            .sort { it.name }
    if (!libsJars.isEmpty()) {
        return libsJars.last()
    }

    File serverJar = new File(defaultServerDir, 'java/projectzomboid.jar')
    if (serverJar.isFile()) {
        return serverJar
    }

    File clientJar = new File(defaultClientDir, 'projectzomboid.jar')
    return clientJar.isFile() ? clientJar : null
}

def gameJarFiles = providers.provider {
    File jar = resolveGameJar()
    return jar == null ? [] : [jar]
}

repositories {
    mavenCentral()
}

dependencies {
    // The Avrix loader and Project Zomboid are supplied by the runtime, so they are
    // required for compilation and tests only and must never be bundled into the plugin.
    compileOnly(fileTree(
            dir: 'libs',
            include: '*.jar',
            exclude: ['ProjectZomboid*.jar', 'projectzomboid*.jar']
    ))
    testImplementation(fileTree(
            dir: 'libs',
            include: '*.jar',
            exclude: ['ProjectZomboid*.jar', 'projectzomboid*.jar']
    ))
    compileOnly(files(gameJarFiles))
    testImplementation(files(gameJarFiles))

    // Test Platform
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.assertj:assertj-core:3.27.7'

    // Mockito for Game Entities & Networking Mocks
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

def checkGameJar = tasks.register('checkGameJar') {
    group = 'build'
    description = 'Verifies that the Project Zomboid game JAR is available for compilation.'

    doLast {
        File jar = resolveGameJar()
        if (jar == null) {
            throw new GradleException(
                    "Project Zomboid JAR not found. Put projectzomboid.jar into libs/, " +
                            "pass -PpzGameJar=<path> or set PZ_GAME_JAR, or point " +
                            "-PpzClientDir=... / -PpzServerDir=... (PZ_CLIENT_DIR / PZ_SERVER_DIR) " +
                            "to the game installation."
            )
        }
        logger.lifecycle("Using Project Zomboid JAR: ${jar}")
    }
}

tasks.named('compileJava') {
    dependsOn checkGameJar
}

tasks.named('compileTestJava') {
    dependsOn checkGameJar
}

def testWorkingDirectories = new java.util.concurrent.ConcurrentHashMap<String, File>()

def cleanupTestWorkingDirectories = tasks.register('cleanupTestWorkingDirectories') {
    description = 'Removes the isolated temporary working directories used by test tasks.'
    doLast {
        testWorkingDirectories.values().each { File directory -> delete(directory) }
        testWorkingDirectories.clear()
    }
}

tasks.withType(Test).configureEach { Test testTask ->
    useJUnitPlatform()
    finalizedBy(cleanupTestWorkingDirectories)

    // Tests exercise code that creates plugin/config folders relative to the working
    // directory. Run each test JVM in its own system temp folder so the project tree
    // is never polluted with test artifacts.
    doFirst {
        File isolatedWorkingDirectory = java.nio.file.Files
                .createTempDirectory("avrix-api-${testTask.name}-")
                .toFile()
        testWorkingDirectories.put(testTask.path, isolatedWorkingDirectory)
        testTask.workingDir = isolatedWorkingDirectory
    }
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'

    def currentVersion = project.version.toString()
    inputs.property('PROJECT_VERSION', currentVersion)

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    filesMatching('**/metadata.yml') {
        filter { String line -> line.replace('%VERSION%', currentVersion) }
    }
}

tasks.named('shadowJar', ShadowJar) {
    archiveBaseName.set(baseArchiveName)
    archiveClassifier.set('')
    destinationDirectory.set(file(customBuildPath))

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/INDEX.LIST'
    exclude 'module-info.class'
    exclude 'META-INF/versions/*/module-info.class'

    manifest {
        attributes(
                'Implementation-Title': baseArchiveName.toString(),
                'Implementation-Version': project.version.toString(),
                'Implementation-Vendor': 'Avrix-API'
        )
    }
}

tasks.named('sourcesJar', Jar) {
    archiveBaseName.set(baseArchiveName)
    archiveClassifier.set('sources')
    destinationDirectory.set(file(customBuildPath))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar') {
    enabled = false
}

tasks.register('releaseBuildJar') {
    group = 'build'
    description = 'Builds the shaded plugin JAR and the sources JAR for release.'

    dependsOn tasks.named('shadowJar')
    dependsOn tasks.named('sourcesJar')
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

def resolveGameDirectory = { String taskName, Provider<String> configured, File fallback ->
    File directory = fallback
    if (configured.isPresent()) {
        File configuredDirectory = new File(configured.get())
        directory = configuredDirectory.isAbsolute()
                ? configuredDirectory
                : new File(projectDirectory, configured.get())
    }
    if (!directory.isDirectory()) {
        throw new GradleException(
                "${taskName}: game directory not found: ${directory}. " +
                        "Set -PpzClientDir=... / -PpzServerDir=... or PZ_CLIENT_DIR / PZ_SERVER_DIR."
        )
    }
    return directory
}

def avrixLoaderJarProperty = providers.gradleProperty('avrixLoaderJar')
def resolveLoaderJar = {
    if (avrixLoaderJarProperty.isPresent()) {
        File configured = new File(avrixLoaderJarProperty.get())
        File jar = configured.isAbsolute() ? configured : new File(projectDirectory, avrixLoaderJarProperty.get())
        if (!jar.isFile()) {
            throw new GradleException("Avrix loader JAR not found: ${jar}. Check -PavrixLoaderJar=...")
        }
        return jar
    }

    List<File> jars = fileTree(dir: new File(projectDirectory, 'libs'), include: 'Avrix-Loader-*.jar')
            .files
            .findAll { it.isFile() }
            .sort { it.name }
    if (jars.isEmpty()) {
        throw new GradleException(
                "Avrix loader JAR not found in ${new File(projectDirectory, 'libs')}. " +
                        "Put Avrix-Loader-<version>.jar into libs or set -PavrixLoaderJar=<path>."
        )
    }
    if (jars.size() > 1) {
        throw new GradleException(
                "Multiple Avrix loader JARs found: ${jars*.name}. Set -PavrixLoaderJar=<path>."
        )
    }
    return jars[0]
}
def avrixLoaderJar = providers.provider { resolveLoaderJar() }

def pzClientMaxHeap = providers.gradleProperty('pzClientMaxHeap').orElse('3g')
def pzServerMinHeap = providers.gradleProperty('pzServerMinHeap').orElse('1g')
def pzServerMaxHeap = providers.gradleProperty('pzServerMaxHeap').orElse('4g')

def clientNativePath = osName.contains('win')
        ? 'win64;.'
        : osName.contains('mac') ? 'mac64:.:natives/osx' : 'linux64:.:natives'

def commonRunJvmArgs = [
        '-Djava.awt.headless=true',
        '--enable-native-access=ALL-UNNAMED',
        '--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED',
        '-Dzomboid.steam=1',
        '-Dzomboid.znetlog=1',
        '-XX:+UseZGC',
        '-XX:-CreateCoredumpOnCrash',
        '-XX:-OmitStackTraceInFastThrow'
]

def clientRunJvmArgs = commonRunJvmArgs + [
        "-Djava.library.path=${clientNativePath}",
        "-Xmx${pzClientMaxHeap.get()}"
]
if (osName.contains('mac')) {
    clientRunJvmArgs += '-XstartOnFirstThread'
}

def serverRunJvmArgs = commonRunJvmArgs + [
        '-Djava.library.path=natives',
        "-Xms${pzServerMinHeap.get()}",
        "-Xmx${pzServerMaxHeap.get()}"
]

def apiPluginJarName = 'Avrix-API.jar'

def registerDeployPlugin = { String taskName, String taskDescription, Provider<String> dirProperty, File fallback ->
    tasks.register(taskName, Copy) {
        group = 'run'
        setDescription(taskDescription)
        dependsOn tasks.named('shadowJar')

        from(tasks.named('shadowJar', ShadowJar).flatMap { it.archiveFile })
        into { resolveGameDirectory(taskName, dirProperty, fallback).toPath().resolve('plugins').toFile() }
        rename { apiPluginJarName }

        doFirst {
            File pluginsDirectory = resolveGameDirectory(taskName, dirProperty, fallback)
                    .toPath()
                    .resolve('plugins')
                    .toFile()
            if (!pluginsDirectory.isDirectory() && !pluginsDirectory.mkdirs()) {
                throw new GradleException("${taskName}: cannot create plugins directory: ${pluginsDirectory}")
            }
            fileTree(dir: pluginsDirectory, include: 'Avrix-API-*.jar').files.each { File stale ->
                if (!stale.delete()) {
                    throw new GradleException("${taskName}: cannot remove stale plugin JAR: ${stale}")
                }
            }
        }
    }
}

registerDeployPlugin(
        'deployClientPlugin',
        'Copies the built plugin into the Project Zomboid client plugins directory.',
        pzClientDirProperty,
        defaultClientDir
)
registerDeployPlugin(
        'deployServerPlugin',
        'Copies the built plugin into the Project Zomboid dedicated server plugins directory.',
        pzServerDirProperty,
        defaultServerDir
)

tasks.register('runClient', JavaExec) {
    group = 'run'
    description = 'Builds the plugin, deploys it to the client plugins directory and launches Project Zomboid.'
    dependsOn tasks.named('deployClientPlugin')
    mainClass = 'com.avrix.Main'
    classpath = files(avrixLoaderJar)
    jvmArgs clientRunJvmArgs
    doFirst {
        File gameDirectory = resolveGameDirectory('runClient', pzClientDirProperty, defaultClientDir)
        workingDir = gameDirectory
        jvmArgs "-Davrix.game.dir=${gameDirectory.absolutePath}"
    }
}

tasks.register('runServer', JavaExec) {
    group = 'run'
    description = 'Builds the plugin, deploys it to the dedicated server plugins directory and launches the server.'
    dependsOn tasks.named('deployServerPlugin')
    mainClass = 'com.avrix.Main'
    classpath = files(avrixLoaderJar)
    standardInput = System.in
    jvmArgs serverRunJvmArgs
    doFirst {
        File gameDirectory = resolveGameDirectory('runServer', pzServerDirProperty, defaultServerDir)
        workingDir = gameDirectory
        jvmArgs "-Davrix.game.dir=${gameDirectory.absolutePath}"
    }
}

def runTarget = providers.gradleProperty('target').orElse('client')

tasks.register('run') {
    group = 'run'
    description = 'Builds, deploys and launches the selected target (-Ptarget=client|server, default: client).'

    def target = runTarget.get()
    if (target == 'client') {
        dependsOn tasks.named('runClient')
    } else if (target == 'server') {
        dependsOn tasks.named('runServer')
    } else {
        throw new GradleException("Unknown target '${target}'. Use -Ptarget=client or -Ptarget=server.")
    }
}
